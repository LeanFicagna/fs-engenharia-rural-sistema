<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FS Rural{% endblock %} · Painel</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f2; color: #1f2a1f; }
    header { background: #2f5d34; color: #fff; padding: .75rem 1rem; display: flex; justify-content: space-between; align-items: center; }
    header a, header button { color: #fff; }
    header nav { display: flex; gap: 1rem; align-items: center; }
    .ajuda { font-size: .85rem; color: #555; margin: .25rem 0 0; max-width: 36rem; }
    header button { background: none; border: 1px solid #fff; border-radius: 4px; padding: .25rem .6rem; cursor: pointer; }
    main { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    form.filtros { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: end; }
    label { display: block; font-size: .9rem; margin-bottom: .25rem; }
    input, select, textarea { padding: .4rem; font: inherit; }
    button { padding: .45rem .9rem; font: inherit; cursor: pointer; }
    /* Alvo de toque de pelo menos 44px e foco bem visível ao navegar pelo teclado */
    input:not([type=checkbox]):not([type=radio]), select, button { min-height: 44px; box-sizing: border-box; }
    :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    .mensagem { background: #e3f1e4; border: 1px solid #9fc8a3; padding: .5rem 1rem; margin-bottom: 1rem; }
    .mensagem.warning { background: #fdf3dc; border-color: #e2c27a; }
    .mensagem.error { background: #fbe4e2; border-color: #e0a19b; }
    .titulo { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .erro { color: #a3241b; }
    /* Erro com símbolo + texto, não só a cor */
    .erro-caixa { display: flex; gap: .5rem; align-items: flex-start; background: #fbe4e2; border-left: 4px solid #a3241b; padding: .6rem .75rem; margin: 0 0 1rem; }
    .erro-icone { font-weight: 700; font-size: 1.2rem; line-height: 1.2; }
    .form-login { max-width: 24rem; }
    .form-login input { width: 100%; }
    .campo { margin-bottom: .9rem; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; background: #fff; padding: 1rem; }
    dt { font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <strong>FS Consultoria Rural · Solicitações</strong>
    {% if user.is_authenticated %}
      <nav>
        {% if user.is_superuser %}<a href="{% url 'cadastrar-usuario' %}">Cadastrar usuário</a>{% endif %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          {{ user.get_username }} <button type="submit">Sair</button>
        </form>
      </nav>
    {% endif %}
  </header>
  <main>
    {% for message in messages %}<div class="mensagem {{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
